[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learner"
version = "0.1.0"
description = "Convention learner and vector store service for the PR Code Reviewer platform"
requires-python = ">=3.10"
dependencies = [
    "pr-reviewer-shared",
    "celery[redis]>=5.4.0",
    "langchain-openai>=0.1.25",
    "langchain-core>=0.2.38",
    "qdrant-client>=1.10.1",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sentence-transformers>=3.0.0",  # Free local embeddings (no API key needed)
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.7",
    "black>=24.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
