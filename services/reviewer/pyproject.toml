[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewer"
version = "0.1.0"
description = "GitHub review comment publisher for the PR Code Reviewer platform"
requires-python = ">=3.10"
dependencies = [
    "pr-reviewer-shared",
    "celery[redis]>=5.4.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.7",
    "black>=24.8.0",
    "respx>=0.21.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
