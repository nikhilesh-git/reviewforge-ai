[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway"
version = "0.1.0"
description = "FastAPI webhook gateway for the GitHub PR Code Reviewer platform"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Shared platform library (local)
    "pr-reviewer-shared",
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database (SQLAlchemy + asyncpg are in shared, but alembic CLI needs to be here)
    "alembic>=1.13.3",
    # Redis
    "redis[hiredis]>=5.0.8",
    # HTTP client (for health check calls)
    "httpx>=0.27.2",
    # Logging
    "structlog>=24.4.0",
    # Metrics
    "prometheus-client>=0.21.0",
    # Utilities
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "anyio>=4.6.0",
    "ruff>=0.5.7",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "factory-boy>=3.3.1",
    "faker>=26.0.0",
    "respx>=0.21.1",        # Mock httpx requests in tests
    "freezegun>=1.5.1",     # Freeze time in tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "."
