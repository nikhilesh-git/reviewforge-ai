[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
  | \.git
  | \.venv
  | __pycache__
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "services/gateway/tests",
    "services/worker/tests",
    "services/reviewer/tests",
    "services/learner/tests",
    "shared/tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: pure unit tests with no external dependencies",
    "integration: tests requiring live services (redis, postgres, etc.)",
    "slow: tests that take more than 5 seconds",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:aiofiles",
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.coverage.run]
source = ["services", "shared"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/conftest.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
fail_under = 80
