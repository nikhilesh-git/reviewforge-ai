# Ruff — Python linter and formatter configuration
# https://docs.astral.sh/ruff/

line-length = 88
target-version = "py313"
indent-width = 4

[lint]
# Enable a comprehensive set of rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # Pylint
    "PERF", # Perflint
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "N",    # pep8-naming
    "D",    # pydocstyle
    "TRY",  # tryceratops
    "EM",   # flake8-errmsg
    "FBT",  # flake8-boolean-trap
    "ISC",  # flake8-implicit-str-concat
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLOT", # flake8-slots
    "T20",  # flake8-print
]

ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "S101",   # Use of assert (allowed in tests)
    "TRY003", # Long exception messages — OK in our case
    "EM101",  # String literals in exceptions — OK
    "EM102",  # f-strings in exceptions — OK
    "FBT001", # Boolean positional args — acceptable in some patterns
    "FBT002", # Boolean default args
    "PLR0913",# Too many arguments (agents have many params)
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ANN",     # annotations not required in tests
    "D",       # docstrings not required in tests
    "PLR2004", # magic values in tests
    "ARG",     # unused args (fixtures)
    "PT004",   # fixture does not return
]
"migrations/**/*.py" = ["D", "ANN", "ERA001"]
"**/conftest.py" = ["ANN", "D", "ARG"]
"**/__init__.py" = ["F401", "D"]

[lint.isort]
known-first-party = ["shared", "gateway", "worker", "reviewer", "learner"]
combine-as-imports = true
split-on-trailing-comma = true

[lint.pydocstyle]
convention = "google"

[lint.pylint]
max-args = 8
max-returns = 6

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
