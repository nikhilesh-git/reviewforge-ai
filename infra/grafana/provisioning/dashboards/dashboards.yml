apiVersion: 1

providers:
  - name: 'PR Reviewer Dashboards'
    orgId: 1
    folder: 'PR Reviewer'
    folderUid: 'pr-reviewer'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
