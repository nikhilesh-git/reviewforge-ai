name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.13"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Lint & Format Check ─────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff==0.5.7 black==24.8.0

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Check Black formatting
        run: black --check --diff .

  # ─── Gateway Service Tests ────────────────────────────────────────────────────
  test-gateway:
    name: Test Gateway Service
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install shared package
        run: pip install -e shared/

      - name: Install gateway dependencies
        run: pip install -e "services/gateway/[dev]"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
          REDIS_URL: redis://localhost:6379/0
          INTERNAL_API_KEY: test-internal-api-key
        run: alembic upgrade head

      - name: Run gateway tests
        env:
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          REDIS_URL: redis://localhost:6379/0
          REDIS_STREAM_NAME: "pr:events:test"
          INTERNAL_API_KEY: test-internal-api-key
          APP_ENV: testing
        run: |
          pytest services/gateway/tests/ \
            -v \
            --tb=short \
            --cov=services/gateway/app \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not integration"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: gateway
          fail_ci_if_error: false

  # ─── Shared Package Tests ─────────────────────────────────────────────────────
  test-shared:
    name: Test Shared Package
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install shared package with dev deps
        run: pip install -e "shared/[dev]"

      - name: Run shared package tests
        run: |
          pytest shared/tests/ \
            -v \
            --tb=short \
            --cov=shared \
            --cov-report=xml \
            -m "not integration" \
            || true  # No tests yet — will not fail CI

  # ─── Docker Build Check ───────────────────────────────────────────────────────
  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/gateway/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: github-pr-reviewer-gateway:ci

  # ─── Security Scan ────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r services/ shared/ \
            -x "*/tests/*,*/migrations/*" \
            -f json \
            -o bandit-report.json \
            || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ─── Integration Tests (manual trigger only) ─────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-gateway, test-shared]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install testcontainers
        run: |
          pip install -e shared/
          pip install -e "services/gateway/[dev]"
          pip install testcontainers

      - name: Run integration tests
        env:
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
          INTERNAL_API_KEY: test-internal-api-key
        run: |
          pytest services/gateway/tests/ \
            -v \
            --tb=short \
            -m integration \
            || true  # Integration tests are non-blocking for now
