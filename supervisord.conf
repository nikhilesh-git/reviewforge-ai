[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:gateway]
command=uvicorn services.gateway.app.main:app --host 0.0.0.0 --port %(ENV_PORT)s --proxy-headers --forwarded-allow-ips="*"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
# Limit concurrency to 2 to stay well within 512MB RAM constraints
command=celery -A services.worker.app.celery_app worker --concurrency=2 --loglevel=INFO
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:consumer]
command=python -m services.worker.app.consumer
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
